<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669"/>
      <stop offset="100%" style="stop-color:#10B981"/>
    </linearGradient>
    <linearGradient id="fGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,1)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0.8)"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="96" fill="url(#bg5)"/>
  <!-- Box outline behind the F -->
  <g transform="translate(256,200)" stroke="rgba(255,255,255,0.25)" stroke-width="3" fill="none">
    <path d="M-100,-90 L0,-130 L100,-90 L100,50 L0,90 L-100,50 Z"/>
    <path d="M-100,-90 L0,-50 L100,-90"/>
    <path d="M0,-50 L0,90"/>
  </g>
  <!-- Bold "FF" letters overlapping -->
  <text x="210" y="310" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="220" fill="rgba(255,255,255,0.3)" letter-spacing="-20">F</text>
  <text x="250" y="310" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="220" fill="url(#fGrad)" letter-spacing="-20">F</text>
  <!-- Text -->
  <text x="256" y="440" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="56" fill="white" letter-spacing="-1">FulFill</text>
</svg>
