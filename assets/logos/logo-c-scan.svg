<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0EA5E9"/>
      <stop offset="100%" style="stop-color:#2563EB"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="96" fill="url(#bg3)"/>
  <!-- Scanner viewfinder corners -->
  <g stroke="white" stroke-width="8" stroke-linecap="round" fill="none">
    <!-- Top-left -->
    <path d="M120,170 L120,130 Q120,120 130,120 L170,120"/>
    <!-- Top-right -->
    <path d="M342,120 L382,120 Q392,120 392,130 L392,170"/>
    <!-- Bottom-left -->
    <path d="M120,290 L120,330 Q120,340 130,340 L170,340"/>
    <!-- Bottom-right -->
    <path d="M342,340 L382,340 Q392,340 392,330 L392,290"/>
  </g>
  <!-- Barcode inside viewfinder -->
  <g fill="rgba(255,255,255,0.9)">
    <rect x="155" y="160" width="6" height="140" rx="2"/>
    <rect x="170" y="160" width="10" height="140" rx="2"/>
    <rect x="188" y="160" width="4" height="140" rx="2"/>
    <rect x="200" y="160" width="12" height="140" rx="2"/>
    <rect x="220" y="160" width="6" height="140" rx="2"/>
    <rect x="234" y="160" width="8" height="140" rx="2"/>
    <rect x="250" y="160" width="4" height="140" rx="2"/>
    <rect x="262" y="160" width="14" height="140" rx="2"/>
    <rect x="284" y="160" width="6" height="140" rx="2"/>
    <rect x="298" y="160" width="10" height="140" rx="2"/>
    <rect x="316" y="160" width="4" height="140" rx="2"/>
    <rect x="328" y="160" width="8" height="140" rx="2"/>
    <rect x="344" y="160" width="6" height="140" rx="2"/>
  </g>
  <!-- Scan laser line -->
  <line x1="130" y1="230" x2="382" y2="230" stroke="#F43F5E" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  <!-- Checkmark badge -->
  <circle cx="390" cy="120" r="36" fill="#10B981"/>
  <polyline points="372,120 385,133 410,108" fill="none" stroke="white" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Text -->
  <text x="256" y="430" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="64" fill="white" letter-spacing="-1">FulFill</text>
</svg>
