<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F97316"/>
      <stop offset="100%" style="stop-color:#EA580C"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="96" fill="url(#bg2)"/>
  <!-- Stylized F made of stacked boxes -->
  <g transform="translate(72, 56)">
    <!-- Top row - 3 boxes -->
    <rect x="0" y="0" width="110" height="110" rx="12" fill="rgba(255,255,255,0.95)"/>
    <rect x="125" y="0" width="110" height="110" rx="12" fill="rgba(255,255,255,0.95)"/>
    <rect x="250" y="0" width="110" height="110" rx="12" fill="rgba(255,255,255,0.95)"/>
    <!-- Middle row - 2 boxes -->
    <rect x="0" y="125" width="110" height="110" rx="12" fill="rgba(255,255,255,0.85)"/>
    <rect x="125" y="125" width="110" height="110" rx="12" fill="rgba(255,255,255,0.85)"/>
    <!-- Bottom row - 1 box -->
    <rect x="0" y="250" width="110" height="110" rx="12" fill="rgba(255,255,255,0.7)"/>
    <!-- Box tape lines -->
    <line x1="55" y1="0" x2="55" y2="110" stroke="rgba(249,115,22,0.3)" stroke-width="3"/>
    <line x1="180" y1="0" x2="180" y2="110" stroke="rgba(249,115,22,0.3)" stroke-width="3"/>
    <line x1="305" y1="0" x2="305" y2="110" stroke="rgba(249,115,22,0.3)" stroke-width="3"/>
    <line x1="55" y1="125" x2="55" y2="235" stroke="rgba(249,115,22,0.3)" stroke-width="3"/>
    <line x1="180" y1="125" x2="180" y2="235" stroke="rgba(249,115,22,0.3)" stroke-width="3"/>
    <line x1="55" y1="250" x2="55" y2="360" stroke="rgba(249,115,22,0.3)" stroke-width="3"/>
  </g>
</svg>
