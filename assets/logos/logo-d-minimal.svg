<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E293B"/>
      <stop offset="100%" style="stop-color:#0F172A"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="96" fill="url(#bg4)"/>
  <!-- Abstract "F" lettermark -->
  <g transform="translate(256,220)">
    <!-- Vertical bar of F -->
    <rect x="-90" y="-130" width="32" height="260" rx="16" fill="white"/>
    <!-- Top horizontal bar of F -->
    <rect x="-90" y="-130" width="180" height="32" rx="16" fill="#818CF8"/>
    <!-- Middle horizontal bar of F (shorter) -->
    <rect x="-90" y="-20" width="130" height="32" rx="16" fill="#A78BFA"/>
    <!-- Arrow/check pointing right-down from middle bar -->
    <g transform="translate(60, 40)">
      <polyline points="-10,-20 10,10 60,-50" fill="none" stroke="#10B981" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  <!-- Text -->
  <text x="256" y="430" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="64" fill="white" letter-spacing="-1">FulFill</text>
</svg>
